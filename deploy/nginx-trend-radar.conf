# 趋势雷达看板 nginx 配置（阿里云 ECS）
# 备案前：server_name 用 _ ，直接用 ECS 公网 IP 访问（http://<IP>）
# 备案后：把 server_name 改为 chinghuo.com www.chinghuo.com，并增加 443 HTTPS 监听

server {
    listen 80 default_server;
    server_name _;   # 备案后改为：chinghuo.com www.chinghuo.com

    root /var/www/trend-radar;
    index index.html;

    # 禁止访问 .git / 隐藏目录（git pull 同步代码需要保留 .git，但不可被外部访问）
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # 实时数据层不缓存，确保每个交易日更新后立即生效
    location = /js/data.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /js/policy-funds-data.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    access_log /var/log/nginx/trend-radar.access.log;
    error_log  /var/log/nginx/trend-radar.error.log;
}
