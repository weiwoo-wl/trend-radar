name: 每日数据更新（从 Gitee 接力）

on:
  # Gitee Go 在北京时间 16:30 / 20:30 抓取并推到 Gitee；
  # 本 workflow 在之后 1 小时从 Gitee 拉取，再推到 GitHub Pages。
  # GitHub Actions 时区为 UTC：北京 17:30 = UTC 9:30，北京 21:30 = UTC 13:30
  schedule:
    - cron: '30 9 * * 1-5'
    - cron: '30 13 * * 1-5'
  # 支持手动触发
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-from-gitee:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v4

      - name: 从 Gitee 拉取数据文件（带重试，私有仓库用 token）
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          for i in 1 2 3; do
            rm -rf /tmp/gitee-src
            for URL in \
              "https://oauth2:${GITEE_TOKEN}@gitee.com/wyweiwoo/trend-radar.git" \
              "https://wyweiwoo:${GITEE_TOKEN}@gitee.com/wyweiwoo/trend-radar.git" ; do
              if git clone --depth 1 "$URL" /tmp/gitee-src 2>/dev/null; then
                echo "Gitee clone 成功"
                break 2
              fi
            done
            echo "第 $i 次 clone Gitee 失败，10 秒后重试..."
            sleep 10
          done
          if [ ! -f /tmp/gitee-src/js/data.js ]; then
            echo "::error::无法从 Gitee 获取 data.js，接力失败"
            exit 1
          fi
          cp /tmp/gitee-src/js/data.js js/data.js
          cp /tmp/gitee-src/js/policy-funds-data.js js/policy-funds-data.js
          cp /tmp/gitee-src/js/earnings-data.js js/earnings-data.js

      - name: 提交并推送到 GitHub
        run: |
          git config user.email "sync-bot@github.local"
          git config user.name "sync-bot"
          git add js/data.js js/policy-funds-data.js js/earnings-data.js
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "data: sync from Gitee $(date +%Y-%m-%dT%H-%M)"
            git push
            echo "已推送至 GitHub，GitHub Pages 将自动重新部署"
          fi
