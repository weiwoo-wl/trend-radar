# Gitee Go 流水线（方案B：国内IP抓取，data.js 推送回 GitHub Pages）
# 注意：Gitee Go 用 .workflow/ 目录（不是 .github/workflows/），cron 为 7 段：秒 分 时 日 月 周 年
# 容器时区为北京时间（CST），故 16:30 / 20:30 直接用北京时间。
version: '1.0'

name: daily-data-update
displayName: 趋势雷达每日数据更新

triggers:
  schedule:
    # 每个交易日 16:30 北京时间首次更新
    - cron: '0 30 16 ? * 1-5 *'
    # 每个交易日 20:30 北京时间补取晚间发布的融资融券等数据
    - cron: '0 30 20 ? * 1-5 *'

stages:
  - stage:
      name: fetch-and-push
      displayName: 抓取数据并推送回 GitHub
      strategy: naturally
      trigger: auto
      steps:
        step: build@python
        name: run-fetch
        displayName: 运行抓取脚本
        pythonVersion: '3.9'
        commands:
          - python3 -m pip install --upgrade pip
          - pip3 config set global.index-url https://pypi.tuna.tsinghua.edu.cn/simple
          - pip3 install -r scripts/requirements.txt
          - python3 scripts/fetch_policy_funds.py || echo "::warning::policy funds failed"
          - python3 scripts/fetch_data.py || echo "::warning::market data failed"
          - python3 scripts/fetch_earnings.py || echo "::warning::earnings failed"
          - git config user.email "gitee-go-bot@gitee.local"
          - git config user.name "gitee-go-bot"
          - git remote remove github 2>/dev/null; git remote add github https://$GITHUB_TOKEN@github.com/weiwoo-wl/trend-radar.git
          - git checkout main 2>/dev/null || true
          - git add js/data.js js/policy-funds-data.js js/earnings-data.js
          - git diff --staged --quiet || git commit -m "data: auto-update $(date +%Y-%m-%d) via Gitee Go"
          - git push github HEAD:main
